; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=UniKey (bộ gõ tiếng Việt)
Category=Input
Target=image
Type=portable
Installer=UniKeyNT.exe (+ thư mục)
Args=copy -> %ProgramFiles%\UniKey ; shortcut Startup (All Users) + Desktop
RunAs=pe-offline
DetectPath=%ProgramFiles%\UniKey\UniKeyNT.exe
Default=1
License=Freeware (GPL source cho bản cũ)
Verify=1
Note=Portable -> chép offline được ngay trong PE (cách D). Cấu hình mặc định (Unicode, Telex) bằng file ukmacro/registry HKCU mặc định
