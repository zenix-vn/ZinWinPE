; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=.NET Framework 3.5
Category=Runtime
Target=image
Type=feature
Installer=sources\sxs (từ ISO Windows)
Args=dism /Image:W:\ /Enable-Feature /FeatureName:NetFx3 /All /Source:<ISO>\sources\sxs /LimitAccess
RunAs=pe-offline
Default=1
License=Windows component
Verify=0
Note=Bật offline được ngay trong PE; trong image chuẩn thì bật ở Audit Mode
