; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=7-Zip x64
Category=Archive
Target=image
Type=exe
Installer=7z-x64.exe
Args=/S
RunAs=system
DetectPath=%ProgramFiles%\7-Zip\7z.exe
Default=1
Winget=7zip.7zip
License=LGPL (dùng thương mại OK)
Verify=0
Note=Thay cho WinRAR (WinRAR là phần mềm trả phí)
