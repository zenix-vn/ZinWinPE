; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=SumatraPDF
Category=PDF
Target=image
Type=exe
Installer=SumatraPDF-64-install.exe
Args=-install -s -all-users
RunAs=system
DetectPath=%ProgramFiles%\SumatraPDF\SumatraPDF.exe
Default=1
Winget=SumatraPDF.SumatraPDF
License=GPLv3 (dùng thương mại OK)
Verify=1
Note=Đọc PDF mặc định, nhẹ; đặt làm app mặc định qua DefaultAppAssociations.xml
