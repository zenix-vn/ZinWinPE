; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=Zalo PC
Category=Chat
Target=zinpost
Type=exe
Installer=ZaloSetup.exe
Args=(cần kiểm thử tham số silent)
RunAs=user
DetectPath=%LocalAppData%\Programs\Zalo\Zalo.exe
Default=1
License=Freeware
Verify=1
Note=Cài theo user (%LocalAppData%) -> chạy ở FirstLogonCommands với quyền user, không chạy từ SetupComplete (SYSTEM)
