; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=Microsoft 365 / Office LTSC (Office Deployment Tool)
Category=Office
Target=zinpost
Type=odt
Installer=setup.exe + Office\Data (nguồn offline) + config-*.xml
Args=/configure config-365-vi.xml
RunAs=system
DetectPath=%ProgramFiles%\Microsoft Office\root\Office16\WINWORD.EXE
Default=0
License=License của KHÁCH (Microsoft 365 / LTSC)
Verify=1
Note=Nguồn offline ~3-4 GB -> tính vào ngân sách 64 GB; hoặc tải online khi có mạng. Không tích hợp công cụ kích hoạt lậu
