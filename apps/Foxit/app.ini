; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=Foxit PDF Reader
Category=PDF
Target=zinpost
Type=exe
Installer=FoxitPDFReader_Setup.exe
Args=(cần kiểm thử: /VERYSILENT /NORESTART hoặc bản MSI)
