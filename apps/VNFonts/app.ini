; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=Bộ font tiếng Việt (VNI, TCVN3/.Vn*)
Category=Font
Target=image
Type=font
Installer=Fonts\*.ttf
Args=copy -> W:\Windows\Fonts + đăng ký trong hive SOFTWARE offline (reg load)
RunAs=pe-offline
DetectPath=%SystemRoot%\Fonts\VNI-Times.ttf
Default=1
License=Kiểm tra nguồn font
Verify=1
Note=Cần cho văn bản cũ (VNI, TCVN3) ở cơ quan, trường học
