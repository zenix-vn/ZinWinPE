; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=AnyDesk
Category=Remote
Target=zinpost
Type=exe
Installer=AnyDesk.exe
Args=--install "%ProgramFiles(x86)%\AnyDesk" --start-with-win --create-shortcuts --create-desktop-icon --silent
RunAs=system
DetectPath=%ProgramFiles(x86)%\AnyDesk\AnyDesk.exe
Default=0
Winget=AnyDesk.AnyDesk
License=Miễn phí cá nhân
Verify=1
Note=Không đưa vào image (ID trùng)
