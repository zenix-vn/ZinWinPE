; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=UltraViewer
Category=Remote
Target=zinpost
Type=exe
Installer=UltraViewer_setup.exe
Args=/VERYSILENT /NORESTART
RunAs=system
DetectPath=%ProgramFiles(x86)%\UltraViewer\UltraViewer_Desktop.exe
Default=1
Winget=DucFabulous.UltraViewer
License=Freeware (kiểm tra điều khoản)
Verify=1
Note=KHÔNG đưa vào image: ID máy có thể bị trùng giữa các máy cài từ cùng image
