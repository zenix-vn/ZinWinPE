; ZinWinPE app manifest — xem docs/ZinWinPE-Design.md mục 8.7
[App]
Name=LibreOffice (+ gói tiếng Việt)
Category=Office
Target=zinpost
Type=msi
Installer=LibreOffice_x86-64.msi
Args=/qn /norestart ALLUSERS=1
RunAs=system
DetectPath=%ProgramFiles%\LibreOffice\program\soffice.exe
Default=0
Winget=TheDocumentFoundation.LibreOffice
License=MPL (miễn phí, thương mại OK)
Verify=1
Note=Lựa chọn miễn phí cho khách không có license Office
