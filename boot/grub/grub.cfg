# ZinWinPE - GRUB2 secondary menu (design 5.2). Lives in ZINBOOT\grub\grub.cfg.
# Modules are built into the image (shim lockdown forbids loading unsigned .mod files).

set timeout=10
set default=0
set zinboot=$root
search --no-floppy --set=zindata --label ZINDATA

if loadfont $prefix/fonts/unicode.pf2 ; then
  set gfxmode=1024x768,auto
  set gfxpayload=keep
  terminal_output gfxterm
  if [ -f $prefix/themes/zinwinpe/theme.txt ]; then
    set theme=$prefix/themes/zinwinpe/theme.txt
  fi
fi

if [ "$grub_platform" = "efi" ]; then
  menuentry "ZinWinPE 11 x64  (Windows Boot Manager)" --class windows {
    chainloader ($zinboot)/EFI/Microsoft/Boot/bootmgfw.efi
  }
else
  menuentry "ZinWinPE 11 x64  (Windows Boot Manager)" --class windows {
    ntldr ($zinboot)/bootmgr
  }
fi

submenu "Boot from internal disk / Khoi dong tu o cung" --class hdd {
  if [ "$grub_platform" = "efi" ]; then
    for efi in (*)/EFI/Microsoft/Boot/bootmgfw.efi (*)/EFI/ubuntu/shimx64.efi (*)/EFI/debian/shimx64.efi (*)/EFI/fedora/shimx64.efi ; do
      if [ -f "$efi" ]; then
        regexp --set=dev '^\((.*)\)' "$efi"
        if [ "$dev" != "$zinboot" ]; then
          menuentry "$efi" "$efi" { chainloader "$2" }
        fi
      fi
    done
  else
    for d in hd1 hd2 hd3 hd0 ; do
      menuentry "MBR of ($d)" "$d" { set root=($2) ; chainloader +1 }
    done
  fi
}

submenu "MemTest (RAM test)" --class memtest {
  if [ "$grub_platform" = "efi" ]; then
    if [ -f ($zinboot)/tools/memtest/mt86plus_x64.efi ]; then
      menuentry "Memtest86+ (UEFI)" { chainloader ($zinboot)/tools/memtest/mt86plus_x64.efi }
    fi
    if [ -f ($zinboot)/tools/memtest86/BOOTX64.efi ]; then
      menuentry "MemTest86 (PassMark, UEFI)" { chainloader ($zinboot)/tools/memtest86/BOOTX64.efi }
    fi
  else
    if [ -f ($zinboot)/tools/memtest/mt86plus_x64.bin ]; then
      menuentry "Memtest86+ (BIOS)" { linux16 ($zinboot)/tools/memtest/mt86plus_x64.bin }
    fi
  fi
}

# ISO files in ZINDATA\ISO\Linux and ZINDATA\ISO\Tools.
# Distros that ship /boot/grub/loopback.cfg (SystemRescue, GParted Live, Clonezilla, Ubuntu...) boot generically.
# With Secure Boot ON only kernels signed by a key in db/MOK will start.
if [ -n "$zindata" ]; then
  submenu "ISO Linux / Tools (ZINDATA\\ISO)" --class iso {
    for iso in ($zindata)/ISO/Linux/*.iso ($zindata)/ISO/Tools/*.iso ; do
      if [ -f "$iso" ]; then
        regexp --set=iso_path '^\(.*\)(/.*)$' "$iso"
        menuentry "$iso_path" "$iso" "$iso_path" {
          set iso_path="$3"
          export iso_path
          loopback loop "$2"
          set root=(loop)
          if [ -f /boot/grub/loopback.cfg ]; then
            configfile /boot/grub/loopback.cfg
          else
            echo "This ISO has no /boot/grub/loopback.cfg - add a custom entry in grub/custom.cfg"
            sleep 5
          fi
        }
      fi
    done
  }
fi

if [ -f $prefix/custom.cfg ]; then
  source $prefix/custom.cfg
fi

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware setup (BIOS)" --class settings { fwsetup }
fi
menuentry "Reboot / Khoi dong lai" --class restart { reboot }
menuentry "Power off / Tat may" --class shutdown { halt }
