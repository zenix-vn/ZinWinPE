; ZinWinPE configuration -> copied to ZINDATA\ZinPE\Config\zinpe.ini
[General]
; vi-VN | en-US  (ZinSetup / FixBoot / Installer UI; logs are always English)
Language=vi-VN
ShopName=ZinWinPE
TimeZone=SE Asia Standard Time

[Loader]
; Normal | FullRAM | Safe  (F / S at the startup prompt override this)
Mode=Normal
LoadPeDrivers=1
StartNetwork=1
NtpServer=time.windows.com

[Setup]
; File name (without .json) in ZinPE\Presets; empty = suggest by hardware
DefaultPreset=
